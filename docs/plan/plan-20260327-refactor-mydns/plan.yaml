plan_id: plan-20260327-refactor-mydns
objective: 在功能正常前提下重构项目，结构更清晰、代码更简洁可维护，优先使用库函数，移除冗余逻辑/判断，并优化性能。
created_at: "2026-03-27T12:00:00+08:00"
created_by: gem-planner
status: completed
research_confidence: high

tldr: |
  本计划遵循“低风险结构清理 -> 性能优化 -> 文档与测试收尾”的顺序推进。
  关键不变量：保持 DNS 功能行为不变，严格遵守 AGENTS.md 的 hook 顺序约束，先烟测再全量回归。
  通过波次间 contracts 与每波次回滚策略，确保可并行执行与可逆变更。

open_questions:
  - 当前阶段无阻塞性问题；若性能优化涉及行为边界，将以新增回归测试先行锁定。

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: 结构清理误改 hook 顺序校验，导致配置通过但运行语义漂移
      likelihood: medium
      impact: critical
      mitigation: 先执行并固化 test_config.py 顺序用例为烟测门禁，再做清理；不通过则立即回滚本波次
    - scenario: ResolverManager/selector 性能优化引入 first_success 与 wait_all 语义偏差
      likelihood: medium
      impact: high
      mitigation: 在优化前后对比 step3/step4 关键测试与延迟断言，任何语义不一致立即回退到前一提交
    - scenario: HTTPS 子查询去重优化导致 ECH 注入条件误判
      likelihood: low
      impact: high
      mitigation: 以 test_https_record_hook.py 为强制门禁并补充多 rdata 场景测试
  assumptions:
    - 以 unittest 为唯一测试框架，使用 uv run 作为标准执行入口
    - 当前 docs/prd.yaml 不存在，本计划不与既有 PRD 冲突
    - 重构以“可读性与可维护性优先”，不引入破坏性 API 变更

implementation_specification:
  code_structure: >-
    先统一配置与插件层可复用纯函数/校验逻辑，再进入上游收集与选择热路径优化，最后补齐测试与文档。
    所有行为性变更必须由测试先锁定，再实现，再复测。
  affected_areas:
    - config.py
    - plugins/
    - upstream/
    - tests/
    - README.md
  component_details:
    - component: 配置装配与语义校验层
      responsibility: 消除重复扫描/重复装配分支，保持 hook 顺序约束与规则语义不变
      interfaces:
        - build_runtime_config(raw: dict) -> RuntimeConfig
        - _validate_request_hook_order(...)
        - _validate_resolver_hook_order(...)
    - component: 插件公共逻辑层
      responsibility: 提取重复 RRSet 构造与 guard/normalize 模式，减少重复代码并保持输出一致
      interfaces:
        - 统一的 RRSet 构造辅助函数（供 domain_rule/ip_rule/speedcheck 复用）
        - 统一前置 guard 判定辅助函数（供 resolver/https_record 场景复用）
    - component: 上游并发与选择层
      responsibility: 减少热路径重复计算与不必要遍历，保持 A/AAAA(wait_all) 与 non-A(first_success) 语义
      interfaces:
        - ResolverManager.collect(ctx, timeout_s)
        - select_best_answer(candidates)
    - component: 测试与文档层
      responsibility: 执行烟测与全量门禁，更新 README 的测试/策略描述
      interfaces:
        - uv run python -m unittest <smoke subset>
        - uv run python -m unittest discover -s tests -v
  dependencies:
    - component: Pipeline
      relationship: 依赖 ResolverManager.collect 结果并串联 hooks
    - component: HttpsRecordResponseHook
      relationship: 依赖 Pipeline.resolve 子查询结果与上游策略稳定性
    - component: test_config/test_resolver_manager_step3/test_selector_step4
      relationship: 作为语义不变量守护
  integration_points:
    - 配置装配入口：config.build_runtime_config
    - 上游并发入口：upstream.resolver_manager.ResolverManager.collect
    - 选择策略入口：upstream.selector.select_best_answer
    - 性能敏感插件：plugins/speedcheck.py 与 plugins/https_record.py

contracts:
  - from_task: T01
    to_task: T02
    interface: 烟测基线报告（hook 顺序、step2/3/4 核心用例、关键耗时样本）
    format: markdown checklist + test result summary
  - from_task: T02
    to_task: T03
    interface: 配置层不变量清单（hook 顺序约束、规则语义、默认装配行为）
    format: yaml invariants
  - from_task: T03
    to_task: T04
    interface: 公共辅助函数接口（RRSet builder / guard helper）
    format: python function signatures + migration mapping
  - from_task: T04
    to_task: T05
    interface: 上游热路径优化边界（A/AAAA wait_all, non-A first_success, resolver hook 跳过条件）
    format: behavior matrix table
  - from_task: T05
    to_task: T06
    interface: 性能优化结果与回归影响面
    format: before/after metrics note + affected tests list
  - from_task: T06
    to_task: T07
    interface: 文档变更清单与测试门禁结果
    format: checklist

wave_rollbacks:
  - wave: 1
    rollback_strategy: 任何烟测失败，回滚本波次全部结构改动，仅保留无行为影响的注释/命名调整
  - wave: 2
    rollback_strategy: 若公共函数抽取导致任一插件输出不一致，回滚抽取提交并恢复原函数实现
  - wave: 3
    rollback_strategy: 若 step3/step4/https 语义回归或性能无改善，回滚性能优化提交，保留结构清理成果
  - wave: 4
    rollback_strategy: 若全量回归失败，回滚文档与测试新增提交到上一稳定点并重新切分补丁

