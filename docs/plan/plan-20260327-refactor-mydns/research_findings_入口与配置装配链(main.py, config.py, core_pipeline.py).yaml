  naming_patterns_in_domain: "以 `_validate_*` 表示语义校验；`effective_*` 表示默认值合并后的规范化规格；`_apply_top_level_*` 表示顶层规则注入。"
  structure_of_domain: "main 只做启动；config 做装配；pipeline 做请求时编排；resolver_manager 专职上游并发。"
  error_handling_in_domain: "配置阶段使用 ValueError 明确报错；运行时 server 层将解析/处理异常映射为 REFUSED/FORMERR/SERVFAIL。"
  testing_in_domain: "按 step 分层测试，配置与流水线关键语义由独立测试覆盖。"
  documentation_in_domain: "AGENTS.md 明确要求先理解入口/配置/pipeline/上游再修改，并强调 hook 顺序约束。"

