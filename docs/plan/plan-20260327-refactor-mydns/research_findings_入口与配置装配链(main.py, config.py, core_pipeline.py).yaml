refactor_steps_low_risk:
  - step: 1
    change: "统一默认装配来源，消除双份默认定义"
    files:
      - app.py
      - config.py
      - main.py
    concrete_action: |
      保留 `config.py` 的 `_DEFAULT_*` 作为唯一事实来源；
      将 `main.py` 中 fallback 分支改为调用 `build_runtime_config({})` 或移除 fallback（按产品决策）；
      使 `app.py.build_pipeline` 仅作为薄包装（或删除）。
    expected_effect: "降低默认配置维护分叉风险，减少冗余代码。"

  - step: 2
    change: "减少配置阶段重复遍历/深拷贝"
    files:
      - config.py
    concrete_action: |
      在 `RuntimeSemanticConfigModel._validate_runtime` 内一次性预分组 hooks（按 class_path）；
      复用分组结果替代多次 `_find_hooks`；
      `_apply_top_level_domain_rules/_apply_top_level_ip_rules` 仅在命中目标 hook 时复制对象，未命中直接复用原 spec（或浅复制）。
    expected_effect: "降低配置装配 CPU/内存开销，保持行为不变。"

  - step: 3
    change: "优化动态类加载热点"
    files:
      - config.py
    concrete_action: |
      给 `_load_class(class_path, expected_base)` 增加缓存层（例如基于 class_path + expected_base 的缓存）；
      保持子类校验不变。
    expected_effect: "减少重复 import/getattr 路径成本，简化频繁构建时开销。"

  - step: 4
    change: "优化 ResolverManager 内部重复计算与日志开销"
    files:
      - upstream/resolver_manager.py
      - core/pipeline.py
    concrete_action: |
      `collect()` 中避免对同一 resolver 的 timeout 重复计算；
      对 `sorted(ctx.tags)` 等调试参数在 debug 开启时再计算。
    expected_effect: "减小请求热路径上的微开销。"

  - step: 5
    change: "并发任务管理收敛"
    files:
      - upstream/resolver_manager.py
    concrete_action: |
      保持当前行为语义不变前提下，收敛 `create_task/as_completed/cancel` 代码路径（可逐步引入更结构化任务管理）；
      先以重构函数提取为主，后续再评估机制替换。
    expected_effect: "提高可维护性并降低取消时序相关风险。"

