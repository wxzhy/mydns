risks_and_rollback:
  risks:
    - risk: "hook 顺序校验语义回归"
      affected_files:
        - config.py
      detail: "若重构 `_validate_*_hook_order`，可能放宽或错误收紧既有约束。"
    - risk: "默认装配行为偏移"
      affected_files:
        - main.py
        - app.py
        - config.py
      detail: "去重默认定义时，可能导致默认 resolver/hook 集合变化。"
    - risk: "上游并发提前返回语义变化"
      affected_files:
        - upstream/resolver_manager.py
      detail: "first_success 与 wait_all 分支若改写不当，会改变 A/AAAA 与其他类型行为。"
    - risk: "UDP 高并发任务处理时序变化"
      affected_files:
