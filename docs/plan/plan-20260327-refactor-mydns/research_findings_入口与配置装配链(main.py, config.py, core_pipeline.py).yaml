plan_id: plan-20260327-refactor-mydns
objective: 全项目重构与性能优化（功能不变）
focus_area: 入口与配置装配链(main.py, config.py, core/pipeline.py)
created_at: "2026-03-27"
created_by: gem-researcher
status: completed

tldr: |
  - 入口主链路为 `main.main -> load_runtime_config -> build_runtime_config -> Pipeline.process`，服务层由 `server/udp_server.py` 与 `server/tcp_server.py` 调用 `Pipeline.process` 完成请求处理。
  - 配置装配的职责主要集中在 `config.py`：语法解析（Pydantic）、语义校验（hook 顺序与 tag 约束）、规则注入（top-level domain/ip rules）、对象构建（resolver/hook 实例化）。
  - 可见重复/冗余点包括：`app.py` 与 `config.py` 默认装配重复、`main.py` 的 `build_pipeline` 回退分支弱可达、`RuntimeSemanticConfigModel._validate_runtime` 多次线性扫描 hooks、`ResolverManager.collect` 重复计算 timeout。
  - 热路径性能风险主要位于 `ResolverManager.collect`（并发任务 + hook 串行处理）、日志参数预计算（`sorted(ctx.tags)`）、以及高并发 UDP 场景下 `_DNSDatagramProtocol` 的无背压 task 增长。
  - 当前测试覆盖与该域强相关文件充足（`test_config.py`、`test_pipeline_step2.py`、`test_resolver_manager_step3.py`、`test_udp_integration_step5.py`、`test_tcp_integration_step5.py`），可支撑低风险分阶段重构。

research_metadata:
  methodology: "三轮混合检索：semantic_search（尝试）、grep_search（符号定位）、read_file（实现细读）、code usages（依赖/调用关系发现）"
  scope: "聚焦入口与配置装配链；覆盖 main/config/pipeline 及其直接运行链路（server/wire/resolver_manager）与相关测试"
  confidence: high
  coverage: 90

