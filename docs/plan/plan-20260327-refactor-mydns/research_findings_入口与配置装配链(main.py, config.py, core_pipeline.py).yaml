patterns_found:
  - category: architecture
    pattern: 入口-配置-流水线分层
    description: `main.py` 负责启动，`config.py` 负责装配，`core/pipeline.py` 负责运行时编排。
    examples:
      - file: main.py
        location: main.py:73
        snippet: "runtime = load_runtime_config(args.config)"
      - file: config.py
        location: config.py:533
        snippet: "pipeline = Pipeline(...)"
      - file: core/pipeline.py
        location: core/pipeline.py:55
        snippet: "_process_with_timeout: request -> upstream -> response"
    prevalence: common

  - category: structure
    pattern: 配置模型 + 语义二阶段校验
    description: 先由 Pydantic 模型校验结构，再进行 hook 顺序与 tag 引用语义校验。
    examples:
      - file: config.py
        location: config.py:499
        snippet: "parsed = RawRuntimeConfigModel.model_validate(raw)"
      - file: config.py
        location: config.py:512
        snippet: "RuntimeSemanticConfigModel.model_validate({...})"
    prevalence: common

  - category: architecture
    pattern: 动态类加载装配
    description: hook/resolver 通过类路径字符串动态加载并实例化。
    examples:
      - file: config.py
        location: config.py:565
        snippet: "module = import_module(module_name)"
      - file: config.py
        location: config.py:549
        snippet: "_build_hook_objects(...)"
    prevalence: common

  - category: structure
    pattern: 默认装配重复定义
    description: 默认 resolver/hook 列表在 `config.py` 与 `app.py` 双份维护。
    examples:
      - file: config.py
        location: config.py:85
        snippet: "_DEFAULT_REQUEST_HOOKS / _DEFAULT_RESOLVER_HOOKS / _DEFAULT_RESPONSE_HOOKS / _DEFAULT_RESOLVERS"
      - file: app.py
        location: app.py:15
        snippet: "def build_pipeline() -> Pipeline: ..."
    prevalence: occasional

  - category: performance
    pattern: 多次线性扫描与深拷贝
    description: 针对 hooks/specs 的重复遍历与 `model_copy(deep=True)` 在配置构建阶段较频繁。
    examples:
      - file: config.py
        location: config.py:396
        snippet: "domain_rule_hooks = _find_hooks(...)"
      - file: config.py
        location: config.py:417
        snippet: "for hook in _find_hooks(self.request_hooks, ...)"
      - file: config.py
        location: config.py:586
        snippet: "return [spec.model_copy(deep=True) for spec in specs]"
    prevalence: common

  - category: performance
    pattern: 并发任务手动管理
    description: `ResolverManager.collect` 使用 `create_task + as_completed + cancel` 管理任务生命周期。
    examples:
      - file: upstream/resolver_manager.py
        location: upstream/resolver_manager.py:63
        snippet: "tasks = [asyncio.create_task(...)]"
      - file: upstream/resolver_manager.py
        location: upstream/resolver_manager.py:67
        snippet: "for completed in asyncio.as_completed(tasks):"
    prevalence: common

related_architecture:
  components_relevant_to_domain:
    - component: main entry
      responsibility: 解析参数并启动 server
      location: main.py
      relationship_to_domain: domain owns this
    - component: runtime config builder
      responsibility: 配置解析、语义校验、对象装配
      location: config.py
      relationship_to_domain: domain owns this
    - component: pipeline orchestrator
      responsibility: 三阶段执行与 fallback
      location: core/pipeline.py
      relationship_to_domain: domain owns this
    - component: upstream manager
      responsibility: 上游并发调度与候选结果收集
      location: upstream/resolver_manager.py
      relationship_to_domain: domain depends on this
    - component: transport servers
      responsibility: TCP/UDP 报文读写与 pipeline 调用
      location: server/
      relationship_to_domain: this uses domain outputs
  interfaces_used_by_domain:
    - interface: RequestHook/ResolverHook/ResponseHook
      location: core/hooks.py
      usage_pattern: Pipeline/ResolverManager 在各阶段回调插件。
    - interface: Resolver
      location: resolver/resolver.py
      usage_pattern: ResolverManager 并发调用 `resolve()`。
  data_flow_involving_domain: |
    UDP/TCP 请求 -> `core.wire.parse_query_context` -> `Pipeline.process`
    -> request hooks -> `ResolverManager.collect` 并发上游 -> response hooks
    -> `core.wire.build_response_wire` -> UDP/TCP 返回。
  key_relationships_to_domain:
    - from: main.main
      to: config.load_runtime_config
      relationship: calls
    - from: config.build_runtime_config
      to: core.pipeline.Pipeline
      relationship: composes
    - from: core.pipeline.Pipeline._run_upstream
      to: upstream.resolver_manager.ResolverManager.collect
      relationship: calls
    - from: server.udp_server.UDPDNSServer._process_datagram
      to: core.pipeline.Pipeline.process
      relationship: calls
    - from: server.tcp_server.TCPDNSServer._process_request_wire
      to: core.pipeline.Pipeline.process
      relationship: calls

