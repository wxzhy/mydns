patterns_found:
  - category: architecture
    pattern: 分阶段 Hook 职责分离 + 配置层顺序强校验
    description: 插件依赖通过 `RequestHook/ResolverHook/ResponseHook` 明确分段，并由 `config.py` 对关键顺序做硬约束，降低运行时语义漂移。
    examples:
      - file: core/hooks.py
        location: core/hooks.py:10
        snippet: "class RequestHook(ABC) ... class ResolverHook(ABC) ... class ResponseHook(ABC)"
      - file: config.py
        location: config.py:658
        snippet: "DomainRuleRequestHook 必须位于 CacheHook 之后"
      - file: config.py
        location: config.py:687
        snippet: "TagSetResolverHook 必须位于 IPRuleResolverHook 之前"
    prevalence: common

  - category: structure
    pattern: 插件配置标准化函数同形重复
    description: 各插件普遍以 `normalize_*_hook_kwargs` 包装 `ConfigModel.model_validate` 与 `model_dump`，结构一致。
    examples:
      - file: plugins/cache.py
        location: plugins/cache.py:143
        snippet: "config = CacheHookConfigModel.model_validate(...)"
      - file: plugins/ip_rule.py
        location: plugins/ip_rule.py:146
        snippet: "config = IPRuleHookConfigModel.model_validate(...)"
      - file: plugins/https_record.py
        location: plugins/https_record.py:190
        snippet: "config = HttpsRecordResponseHookConfigModel.model_validate(...)"
    prevalence: common

  - category: structure
    pattern: RRSet 构造辅助函数重复
    description: `domain_rule/ip_rule/speedcheck` 都有同名 `_build_ip_rrset`，参数与循环逻辑高度相似。
    examples:
      - file: plugins/domain_rule.py
        location: plugins/domain_rule.py:267
        snippet: "def _build_ip_rrset(...): rrset = dns.rrset.RRset(...); rrset.add(...)"
      - file: plugins/ip_rule.py
        location: plugins/ip_rule.py:378
        snippet: "def _build_ip_rrset(...): rrset = dns.rrset.RRset(...); rrset.add(...)"
      - file: plugins/speedcheck.py
        location: plugins/speedcheck.py:315
        snippet: "def _build_ip_rrset(...): rrset = dns.rrset.RRset(...); rrset.add(...)"
    prevalence: occasional

  - category: error_handling
    pattern: 前置 guard + 跳过而非抛错
    description: 对不满足处理前提的响应，优先 `return` 或记录 `reason`，减少对主流程干扰。
    examples:
      - file: upstream/resolver_manager.py
        location: upstream/resolver_manager.py:218
        snippet: "_resolver_hook_skip_reason: non_noerror/invalid_opcode/invalid_qclass"
      - file: plugins/https_record.py
        location: plugins/https_record.py:197
        snippet: "_skip_reason: unsupported_qtype/invalid_opcode/invalid_qclass"
      - file: upstream/resolver_manager.py
        location: upstream/resolver_manager.py:176
        snippet: "resolver hook超时/异常，已忽略"
    prevalence: common

  - category: performance
    pattern: 多层缓存与去重并存
    description: 请求级、插件级、跨请求缓存均已存在，但部分路径仍会重复子查询。
    examples:
      - file: plugins/speedcheck.py
        location: plugins/speedcheck.py:99
        snippet: "pending = [ip for ip in ips if ip not in ctx.ip_list.results]"
      - file: plugins/utils/speedcheck.py
        location: plugins/utils/speedcheck.py:52
        snippet: "alru_cache(maxsize=_probe_cache_max_size, ttl=_probe_cache_ttl_s)"
      - file: plugins/https_record.py
        location: plugins/https_record.py:308
        snippet: "_subqueries_indicate_cloudflare: 每次判定发起 A/AAAA 内部查询"
    prevalence: occasional

