plan_id: plan-20260327-refactor-mydns
objective: 全项目重构与性能优化（功能不变）
focus_area: "plugins/*.py（cache/domain_rule/ip_rule/tagset/speedcheck/https_record）"
created_at: "2026-03-27T00:00:00+08:00"
created_by: gem-researcher
status: completed

tldr: |
  - 6 个目标插件职责分层明确：`cache/domain_rule` 在 request，`tagset/ip_rule/speedcheck` 在 resolver，`https_record` 在 response；且顺序由 `config.py` 强约束。
  - 发现 3 类可抽取重复：`_build_ip_rrset`（3 处）、hook kwargs 标准化函数（6 处同形）、响应前置合法性判断（`resolver_manager` 与 `https_record` 存在相似 guard）。
  - 主要性能热点集中在 `https_record`：同一 HTTPS RRSet 多条 rdata 时，Cloudflare 判定子查询可能重复触发 A/AAAA 内部查询。
  - 现有测试覆盖较充分，顺序/语义/异常路径均有验证；缺口主要在“多 rdata 场景下避免重复子查询”和“重构后公共函数一致性回归”。
  - 低风险重构可按“提取纯函数 -> 合并 guard -> 局部性能缓存 -> 最后做微优化”顺序推进，且不改变 hook 执行顺序语义。

