tldr: |
  - 测试体系采用“step1~step5 分层主链 + 插件/配置/协议专项 + 运行时平台专项（winloop/tricks）”的结构，覆盖从核心抽象到 UDP/TCP 端到端。
  - 对“去冗余+提性能”最关键的回归锚点集中在 `test_cache_hooks.py`、`test_resolver_manager_step3.py`、`test_speedcheck_utils.py`、`test_speedcheck_hooks.py`、`test_selector_step4.py`、`test_config.py`。
  - README 与 AGENTS 对测试命令与分层策略一致：推荐 `uv run python -m unittest discover -s tests -v`，并强调先补对应阶段测试再改实现。
  - 现有测试已验证多项并发与超时语义（并行收集、hook 超时隔离、pending 合并请求、测速并行），但缺少统一性能基线型门禁（固定预算/基准报表）。
  - 文档级约定要求：涉及流水线策略、配置字段、启动行为、测试命令变更时同步更新 README。

