testing_patterns:
  framework: unittest (含 IsolatedAsyncioTestCase)
  coverage_areas:
    - ResolverManager 并发、tag 过滤、timeout 覆盖、hook 异常/超时隔离
    - selector 对 A/AAAA/TXT 的选择语义
    - 多协议 resolver 对 dns.asyncquery 参数透传
    - HTTPS 记录插件的改写与子查询/ECH 缓存行为
  test_organization: "按 step1~step5 分层，upstream/resolver 相关核心在 step3/step4；插件专项单测独立文件。"
  mock_patterns:
    - monkeypatch dns.asyncquery.* 返回伪响应
    - FakePipeline 模拟内部 resolve 子查询
    - SleepResolver/FakeHook 控制时序、超时与异常分支

open_questions:
  - question: HTTPS 查询是否应与 A/AAAA 一样等待全量上游，还是保持 first_success？
    context: 当前 `_need_wait_all_results` 未纳入 HTTPS；AGENTS 中“主要查询类型 A/AAAA/HTTPS”与当前实现分支存在策略解释空间。
  - question: first_success 路径是否允许“并发全启动后取消”带来的额外上游流量成本？
    context: collect 在 first_success 也会先创建全部 task；高并发场景可能形成可见取消浪涌。
  - question: TrickyDatagramSocket.recvfrom 的 5 次重试是否有明确时延预算要求？
    context: 现实现每轮复用完整 timeout，理论最坏等待可放大。

# 缺口仅描述当前调研覆盖边界，不包含实现建议。
gaps:
  - area: HTTPS 在 ResolverManager 分支的直接测试
    description: `tests/test_resolver_manager_step3.py` 仅覆盖 A 与 non-A(TXT)，未直接断言 HTTPS 分支行为。
    impact: 对 HTTPS 查询在 collect 阶段的策略回归保护较弱。
  - area: selector 的 ads 优先规则测试
    description: `tests/test_selector_step4.py` 未覆盖 `select_best_answer` 的 ads 标签优先路径。
    impact: 选择器内部优先级变动时可能缺乏直接告警。
  - area: first_success 取消路径资源回收边界
    description: 现有测试覆盖提前返回时延，但未验证取消任务是否稳定回收 socket/连接资源。
    impact: 在 resolver 数量较大或连接型协议占比高时，性能回归定位难度上升。
  - area: 请求构造热路径开销基线
    description: 无针对 `_copy_request_message` 深拷贝与 ECS 重写开销的微基准或剖析数据。
    impact: 冗余转换优化空间难以量化比较。

# 以下为基于现状代码的“可变更位点事实清单”（用于后续实现计划输入）。
# 保持功能语义不变前提下，列出目标函数与可预期收益类型。
change_candidates:
  - file: upstream/resolver_manager.py
    function: ResolverManager.collect
    current_fact: first_success 分支仍会并发创建全部 resolver task，再在命中后取消剩余任务。
    expected_benefit_if_optimized: "降低无效外呼与任务取消成本；在 resolver 数较多时减少事件循环负载。"

  - file: upstream/resolver_manager.py
    function: ResolverManager.collect / ResolverManager._query_one / resolver/*.resolve
    current_fact: effective_timeout 在 manager 与 resolver 层重复计算；日志预计算也重复读取。
    expected_benefit_if_optimized: "减少重复计算与日志路径开销，简化超时语义。"

  - file: resolver/resolver.py
    function: _copy_request_message / build_request_message
    current_fact: 对每个 resolver 请求都执行 Query.message 的 `to_wire/from_wire` 深拷贝并进行 ECS 合并。
    expected_benefit_if_optimized: "降低多上游并发下的对象分配与序列化开销。"

  - file: upstream/selector.py
    function: select_best_answer / _select_fastest_normal
    current_fact: 当前实现包含候选副本构建 + ads 扫描 + 全量排序 + NOERROR 扫描。
    expected_benefit_if_optimized: "将多次遍历与 O(n log n) 排序收敛到线性扫描路径，降低 response 阶段 CPU 开销。"

  - file: resolver/tricks/udp_trick.py
    function: TrickyDatagramSocket.recvfrom
    current_fact: 5 次循环每次使用完整 timeout 等待；最坏时延放大。
    expected_benefit_if_optimized: "使超时预算更可控，降低尾延迟不确定性。"

  - file: plugins/https_record.py
    function: _subqueries_indicate_cloudflare / _fetch_cached_ech_value
    current_fact: HTTPS 处理可能触发 A/AAAA + HTTPS 额外内部查询；虽然有缓存，但首次命中仍会放大请求链路。
    expected_benefit_if_optimized: "降低 HTTPS 响应路径的附加查询成本与尾延迟。"

regression_and_test_impact:
  impacted_existing_tests:
    - tests/test_resolver_manager_step3.py
    - tests/test_selector_step4.py
    - tests/test_resolvers_multi_and_tricks.py
    - tests/test_https_record_hook.py
    - tests/test_speedcheck_hooks.py
  observations:
    - 现有断言中包含多处时延上界（如 `<0.18`、`<0.13`），任何调度或超时语义微调都可能触发阈值波动。
    - resolver 参数透传（where/port/timeout/verify 等）由 `test_resolvers_multi_and_tricks.py` 直接锁定。
    - HTTPS 插件子查询与缓存行为已有断言，变更其触发条件需同步调整测试期望。
  additional_tests_to_add_in_followup:
    - "ResolverManager: HTTPS qtype 应走哪条分支（当前实现为 first_success）的显式回归测试。"
    - "Selector: ads 标签优先于 elapsed_ms 的显式断言测试。"
    - "first_success 提前结束后 pending 任务取消与资源释放稳定性测试（可结合假 resolver 统计 cancel/close 调用）。"
    - "TrickyDatagramSocket.recvfrom 超时预算上限测试（验证总等待不超预期预算）。"

risks_and_compatibility:
  - "策略兼容风险：若调整 `_need_wait_all_results` 将直接改变 non-A/HTTPS 的首包时延与候选集合规模。"
  - "超时语义风险：合并/下沉 timeout 逻辑可能影响 `test_resolver_specific_timeout_should_override_global_timeout` 的预期。"
  - "报文兼容风险：请求构造链路变更需确保 TXID、ECS、EDNS options 与 question rdclass 完整保真。"
  - "行为兼容风险：selector 优化若改变同耗时候选的稳定顺序，可能影响边界用例与日志可观测性。"
  - "插件联动风险：HTTPS 记录插件依赖 pipeline.resolve 嵌套查询；上游策略变化会放大或收敛该插件的附加开销与行为时序。"
