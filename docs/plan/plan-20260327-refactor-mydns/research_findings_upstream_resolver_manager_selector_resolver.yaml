patterns_found:
  - category: architecture
    pattern: 并发收集 + 条件提前结束
    description: collect 先并发启动所有匹配 resolver，再在 as_completed 循环中按 qtype 分支决定是否提前 break。
    examples:
      - file: upstream/resolver_manager.py
        location: upstream/resolver_manager.py:63-92
        snippet: "for completed in asyncio.as_completed(tasks): ... if not wait_all and _is_normal_result(processed): ... break"
    prevalence: common

  - category: architecture
    pattern: qtype 策略分流
    description: 仅 A/AAAA 走 wait_all；HTTPS 与 TXT/SRV/PTR 等同属 first_success。
    examples:
      - file: upstream/resolver_manager.py
        location: upstream/resolver_manager.py:206-207
        snippet: "return qtype in {dns.rdatatype.A, dns.rdatatype.AAAA}"
      - file: tests/test_resolver_manager_step3.py
        location: tests/test_resolver_manager_step3.py:314-351
        snippet: "test_non_a_returns_first_normal / test_a_waits_all_resolver_and_hook"
    prevalence: common

  - category: structure
    pattern: 选择器多阶段遍历
    description: 先构造 candidates 副本，再扫描 ads 标签，再按 elapsed_ms 全量排序后扫描 NOERROR。
    examples:
      - file: upstream/selector.py
        location: upstream/selector.py:20-57
        snippet: "candidates = [...] ; tagged = _select_tagged_answer(...); ordered = sorted(...)"
    prevalence: common

  - category: performance
    pattern: 超时与报文构造重复计算
    description: timeout 在 manager 与 resolver 两层均计算；请求消息在每 resolver 查询中执行深拷贝与 ECS 重写。
    examples:
      - file: upstream/resolver_manager.py
        location: upstream/resolver_manager.py:53,119
        snippet: "effective_timeout_s = resolver.effective_timeout(timeout_s)"
      - file: resolver/udp_resolver.py
        location: resolver/udp_resolver.py:35
        snippet: "timeout_s = self.effective_timeout(timeout_s)"
      - file: resolver/resolver.py
        location: resolver/resolver.py:88-96
        snippet: "dns.message.from_wire(query.message.to_wire())"
    prevalence: common

  - category: architecture
    pattern: HTTPS 响应插件触发嵌套查询
    description: HttpsRecordResponseHook 在部分条件下并发发起 A/AAAA 子查询并额外发起 HTTPS ECH 来源查询。
    examples:
      - file: plugins/https_record.py
        location: plugins/https_record.py:315-336
        snippet: "results = await asyncio.gather(*(pipeline.resolve(query) for query in queries), return_exceptions=True)"
      - file: plugins/https_record.py
        location: plugins/https_record.py:338-356
        snippet: "answer = await pipeline.resolve(query)"
    prevalence: occasional

  - category: performance
    pattern: trick UDP 接收重试可能放大等待时长
    description: recvfrom 每轮都按 timeout 等待，最多 5 轮，最坏等待可接近 5x timeout。
    examples:
      - file: resolver/tricks/udp_trick.py
        location: resolver/tricks/udp_trick.py:84-95
        snippet: "for _ in range(5): data, addr = await self._protocol.recvfrom(timeout)"
    prevalence: occasional

related_architecture:
  components_relevant_to_domain:
    - component: core.pipeline.Pipeline
      responsibility: 编排 request/upstream/response 阶段
      location: core/pipeline.py
      relationship_to_domain: domain 被该组件调用（_run_upstream）
    - component: plugins.speedcheck.RewriteAnswerByRTTHook
      responsibility: 基础答案构造与 A/AAAA RTT 重写
      location: plugins/speedcheck.py
      relationship_to_domain: this uses domain outputs（使用 ctx.candidates 与 selector）
    - component: plugins.https_record.HttpsRecordResponseHook
      responsibility: HTTPS rrset 改写和 ECH 注入
      location: plugins/https_record.py
      relationship_to_domain: this uses domain outputs，并可反向触发 pipeline.resolve 嵌套查询
    - component: config.build_runtime_config
      responsibility: resolver/hook 实例装配
      location: config.py
      relationship_to_domain: domain depends on this（实例生命周期由配置装配决定）

  interfaces_used_by_domain:
    - interface: resolver.resolver.Resolver
      location: resolver/resolver.py
      usage_pattern: ResolverManager 依赖抽象接口 resolve/effective_timeout
    - interface: core.hooks.ResolverHook
      location: core/hooks.py
      usage_pattern: collect 后对每个结果串行执行 hook（带超时隔离）
    - interface: dns.asyncquery.*
      location: resolver/*.py
      usage_pattern: 各协议 resolver 统一将 QueryMessage 交给 dnspython 异步查询函数

  data_flow_involving_domain: |
    QueryContext(query,tags) -> ResolverManager.collect(tag过滤 + 并发 resolve) -> ResolverResult 列表写入 ctx.candidates
    -> (non-A/AAAA 首个 NOERROR 可直接写 ctx.final_answer 并提前结束)
    -> Response 阶段 RewriteAnswerByRTTHook/select_best_answer 生成/修正 final_answer
    -> HTTPS 响应路径可通过 HttpsRecordResponseHook 再触发 A/AAAA/HTTPS 内部查询。

  key_relationships_to_domain:
    - from: core/pipeline.py
      to: upstream/resolver_manager.py
      relationship: calls
    - from: upstream/resolver_manager.py
      to: resolver/resolver.py
      relationship: calls
    - from: resolver/*.py
      to: dns.asyncquery
      relationship: calls
    - from: plugins/speedcheck.py
      to: upstream/selector.py
      relationship: calls
    - from: plugins/https_record.py
      to: core/pipeline.py::Pipeline.resolve
      relationship: calls

