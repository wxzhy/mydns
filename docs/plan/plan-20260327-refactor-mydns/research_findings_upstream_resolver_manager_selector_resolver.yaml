related_conventions:
  naming_patterns_in_domain: "Resolver 类采用 `*UpstreamResolver` 命名；策略函数采用 `_need_*`/`_is_*`；测试按 step 分层命名。"
  structure_of_domain: "上游层按 管理器（upstream）/协议实现（resolver）/socket trick（resolver/tricks） 分层；选择逻辑独立于管理器放在 selector。"
  error_handling_in_domain: "上游与 hook 异常均降级为结果级错误或日志，不中断整体请求；空结果最终由 Pipeline 回退 SERVFAIL。"
  testing_in_domain: "unittest + IsolatedAsyncioTestCase；通过 monkeypatch dns.asyncquery 验证协议参数传递和并发语义。"
  documentation_in_domain: "代码内中文 docstring 完整说明职责；README/AGENTS 对 A/AAAA wait_all 与其他类型 first_success 有约束描述。"

