plan_id: plan-20260327-refactor-mydns
objective: 全项目重构与性能优化（功能不变）
focus_area: upstream/resolver_manager.py + upstream/selector.py + resolver/*
created_at: "2026-03-27"
created_by: gem-researcher
status: completed

tldr: |
  - 上游并发策略由 `ResolverManager.collect` 决定：`A/AAAA` 走 `wait_all`，其余类型（包含 `HTTPS`）走 `first_success`，并在拿到首个 NOERROR 后提前结束。
  - 选择策略由 `upstream/selector.py` 与 `plugins/speedcheck.py` 组合完成：优先 `ads` 标签结果，其次按耗时选最快 NOERROR，否则回退最快响应。
  - 可观测冗余主要集中在超时计算与消息拷贝链路：`effective_timeout` 多次重复、请求报文 `to_wire/from_wire` 每 resolver 重复执行、选择器存在多次遍历+全量排序。
  - `HTTPS` 查询在主收集阶段不等待全量上游，但 `HttpsRecordResponseHook` 可能触发 `A/AAAA` 子查询与 ECH 来源查询，形成嵌套查询放大效应。
  - 现有测试已覆盖 A/AAAA 与 non-A 分支、resolver 超时/异常、多协议 resolver 参数透传；但 `HTTPS` 在 `ResolverManager` 分支与若干性能边界尚无直接回归。

