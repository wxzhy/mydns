# mydns 示例配置（可通过 main.py --config 加载）

server:
  host: 127.0.0.1
  port: 5335

pipeline:
  upstream_timeout_s: 2

# tag: txt路径 或 txt路径列表
domainset:
  cn:
    - rules/geosite/cn.list
  ads:
    - rules/geosite/category-ads-all.list
  gfw:
    - rules/geosite/gfw.list
  private:
    - rules/geosite/private.list
# 可选：domainset 缓存文件。存在时优先加载；不存在则初始化后自动写入。
domainset_cache_file: cache/domainset.cache

# tag: txt路径 或 txt路径列表
ipset:
  cn:
    - rules/geoip/cn.list
  private:
    - rules/geoip/private.list
  telegram:
    - rules/geoip/telegram.list
  cloudflare:
    - rules/geoip/cloudflare.list

# 按命中的 domainset tag 执行动作，并同步更新 ctx.tags。
# 仅在 hooks.request 中显式声明 plugins.domain_rule.DomainRuleRequestHook 时生效。
# action:
#   intercept: A/AAAA 返回 localhost，TTL 为 1d；其他类型返回空 NOERROR
#   hosts: A/AAAA 返回指定 IP，不转发；其他类型继续转发
domain_rules:
  ads:
    action: intercept
  private:
    action: hosts
    A: 192.168.1.10
    AAAA: "fd00::10"

# plugins.ip_rule.IPRuleResolverHook 的规则配置。
# 仅在 hooks.resolver 中显式声明该插件时生效。
# 执行流程：
# 1. 先检查当前结果是否应处理：必须是 A/AAAA rrset，且不能命中 skip_result_tags
# 2. 再遍历 rrset 中的每条记录，对当前记录按 rules 顺序逐条尝试
# 3. 对命中的 rule，再按 replacement.tag 匹配该源 IP 命中的 ipset tag
# 4. 命中后把结果写入新的 rrset；同一个 replacement.tag 只保留首个命中的结果
# 5. 如果整组记录都没有命中，则保持原 rrset；否则用新的 rrset 回写 answer
# replacement 字段说明：
#   tag: 该源 IP 需要命中的 ipset tag
#   ip: 替换使用的目标 IP / 前缀
#   preserve_prefix_len:
#     可选，保留目标 IP 的前缀位，并从当前源 IP 继承剩余后缀位。
ip_rules:
  skip_result_tags: [ads]
  rules:
    - match_tags: [cn]
      A:
        replacements:
          - tag: cn
            ip: 198.18.0.10
            preserve_prefix_len: 24
          - tag: private
            ip: 192.168.1.10
      AAAA:
        replacements:
          - tag: cn
            ip: "2001:db8:100::10"
            preserve_prefix_len: 64
          - tag: private
            ip: "fd00::10"
    - match_tags: [private]
      A:
        replacements:
          - tag: private
            ip: 192.168.1.10
      AAAA:
        replacements:
          - tag: private
            ip: "fd00::10"

resolvers:
  # 已移除冗余参数：source/source_port/http_version/ssl_context/family/post
  # tcp/udp 可选 use_tricks: true，启用 tricks 中的自定义 socket
  # timeout: 当前 resolver 超时；省略时继承 pipeline.upstream_timeout_s
  # ecs: 可选，支持 CIDR 字符串，或 {address, srclen, scopelen}
  - name: cloudflare
    type: udp
    address: 1.1.1.1
    port: 53
    timeout: 1.2
    ecs: 203.0.113.0/24
    use_tricks: false
    tags: [default]
  - name: alidns
    type: udp
    address: 223.5.5.5
    port: 53
    tags: [default]
  - name: 114dns
    type: udp
    address: 114.114.114.114
    port: 53
    tags: [default, cn]
  - name: dnspod
    type: udp
    address: 119.29.29.29
    port: 53
    tags: [default, cn]
  - name: cloudflare-tcp
    type: tcp
    address: 1.1.1.1
    port: 53
    use_tricks: false
    tags: [default]
  - name: google-tcp
    type: tcp
    address: 8.8.8.8
    port: 53
    use_tricks: true
    tags: [default, gfw]
  - name: dns-google-tls
    type: tls
    address: 8.8.8.8
    port: 853
    server_hostname: dns.google
    tags: [default]
  - name: dns-cloudflare-doh
    type: https
    address: cloudflare-dns.com
    path: /dns-query
    bootstrap_address: 1.1.1.1
    ecs:
      address: "2001:db8::"
      srclen: 48
    tags: [default]
  - name: dns-google-doq
    type: quic
    address: 8.8.8.8
    server_hostname: dns.google
    tags: [default]
  - name: google
    type: udp
    address: 8.8.8.8
    port: 53
    tags: [default, gfw]
    use_tricks: true

hooks:
  # hook 支持两种写法：
  # 1. 只有类路径的简写，适合无参数插件
  #    - plugins.builtin.NoopRequestHook
  # 2. class + kwargs 的完整写法，适合带参数插件
  #    - class: plugins.cache.CacheHook
  #      kwargs:
  #        cache_name: default-main
  #        max_size: 100000
  #
  # 当前内置插件示例：
  # - plugins.builtin.NoopRequestHook / NoopResolverHook / NoopResponseHook
  # - plugins.cache.CacheHook
  # - plugins.domain_rule.DomainRuleRequestHook
  # - plugins.tagset.TagSetResolverHook
  # - plugins.ip_rule.IPRuleResolverHook
  # - plugins.https_record.HttpsRecordResponseHook
  # - plugins.speedcheck.SpeedCheckResolverHook
  # - plugins.speedcheck.RewriteAnswerByRTTHook
  request:
    # 简写：无参数请求阶段插件
    # 可用于占位、调试或作为自定义插件的参考格式
    - plugins.builtin.NoopRequestHook
    # 完整写法：请求阶段读缓存；response 阶段使用同名 cache_name 写回
    - class: plugins.cache.CacheHook
      kwargs:
        cache_name: default-main
        max_size: 100000
        # 默认只缓存 NOERROR(0)；如需同时缓存 NXDOMAIN，可改为 [0, 3]
        # cacheable_rcodes: [0, 3]
    # 显式启用 domain_rules；规则读取自顶层 domain_rules 配置。
    - class: plugins.domain_rule.DomainRuleRequestHook
  resolver:
    # 简写：无参数上游结果插件
    - plugins.builtin.NoopResolverHook
    # 显式启用 CNAME tag 匹配与 uncloaking 过滤。
    # resolver 返回后会先复制 ctx.tags 到 answer.tags；此 hook 再补充 CNAME 命中的结果标签。
    - class: plugins.tagset.TagSetResolverHook
    # 显式启用 IP 改写；规则读取自顶层 ip_rules 配置。
    # 推荐放在 tagset 之后、speedcheck 之前：
    # - tagset 先补充结果标签，供 match_tags 选中规则
    # - ip_rule 再按每个返回 IP 的 ipset tag 逐条改写
    # - speedcheck 最后只对改写后的地址测速
    - class: plugins.ip_rule.IPRuleResolverHook
    # 推荐顺序：tagset -> ip_rule -> speedcheck。
    # 完整写法：对 A/AAAA 候选 IP 执行测速，结果写入 ctx.ip_list
    - class: plugins.speedcheck.SpeedCheckResolverHook
      kwargs:
        timeout_s: 2
        max_size: 10000
        ttl_s: 3600
  response:
    # 简写：无参数响应阶段插件
    - plugins.builtin.NoopResponseHook
    # 手动启用 HTTPS 记录清洗：
    # 1. 移除 alpn 中的 h3
    # 2. 若同时包含 ipv4hint/ipv6hint，则两者一起移除
    # 3. 若没有 ech，且当前结果/提示地址/子查询结果可判定属于 Cloudflare，则注入 cloudflare-ech.com 的 ech
    # 建议放在 CacheHook 之前，这样写入缓存的是最终整理后的 HTTPS 记录。
    - class: plugins.https_record.HttpsRecordResponseHook
      kwargs:
        skip_result_tags: [ads]
        cloudflare_tags: [cloudflare]
    # 完整写法：根据测速 RTT 重写最终返回的 A/AAAA 记录
    - class: plugins.speedcheck.RewriteAnswerByRTTHook
      kwargs:
        max_return_ips: 2
        ttl_s: 900
    # 与 request 阶段使用相同 cache_name，形成读写同一个共享缓存
    - class: plugins.cache.CacheHook
      kwargs:
        cache_name: default-main
        max_size: 100000
