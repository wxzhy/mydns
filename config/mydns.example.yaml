# mydns 示例配置（可通过 main.py --config 加载）

server:
  host: 127.0.0.1
  port: 5335

pipeline:
  upstream_timeout_s: 2

# tag: txt路径 或 txt路径列表
domainset:
  cn:
    - rules/geosite/cn.list
  ads:
    - rules/geosite/category-ads-all.list
  gfw:
    - rules/geosite/gfw.list
  private:
    - rules/geosite/private.list
# 可选：domainset 缓存文件。存在时优先加载；不存在则初始化后自动写入。
domainset_cache_file: cache/domainset.cache

# tag: txt路径 或 txt路径列表
ipset:
  cn:
    - rules/geoip/cn.list
  private:
    - rules/geoip/private.list
  telegram:
    - rules/geoip/telegram.list

resolvers:
  # 已移除冗余参数：source/source_port/http_version/ssl_context/family/post
  # tcp/udp 可选 use_tricks: true，启用 tricks 中的自定义 socket
  # timeout: 当前 resolver 超时；省略时继承 pipeline.upstream_timeout_s
  # ecs: 可选，支持 CIDR 字符串，或 {address, srclen, scopelen}
  - name: cloudflare
    type: udp
    address: 1.1.1.1
    port: 53
    timeout: 1.2
    ecs: 203.0.113.0/24
    use_tricks: false
    tags: [default]
  - name: alidns
    type: udp
    address: 223.5.5.5
    port: 53
    tags: [default]
  - name: 114dns
    type: udp
    address: 114.114.114.114
    port: 53
    tags: [default, cn]
  - name: dnspod
    type: udp
    address: 119.29.29.29
    port: 53
    tags: [default, cn]
  - name: cloudflare-tcp
    type: tcp
    address: 1.1.1.1
    port: 53
    use_tricks: false
    tags: [default]
  - name: google-tcp
    type: tcp
    address: 8.8.8.8
    port: 53
    use_tricks: true
    tags: [default, gfw]
  - name: dns-google-tls
    type: tls
    address: 8.8.8.8
    port: 853
    server_hostname: dns.google
    tags: [default]
  - name: dns-cloudflare-doh
    type: https
    address: cloudflare-dns.com
    path: /dns-query
    bootstrap_address: 1.1.1.1
    ecs:
      address: "2001:db8::"
      srclen: 48
    tags: [default]
  - name: dns-google-doq
    type: quic
    address: 8.8.8.8
    server_hostname: dns.google
    tags: [default]
  - name: google
    type: udp
    address: 8.8.8.8
    port: 53
    tags: [default, gfw]
    use_tricks: true

hooks:
  request:
    - class: plugins.cache.CacheHook
      kwargs:
        cache_name: default-main
        max_size: 100000
    - plugins.builtin.NoopRequestHook
  resolver:
    - plugins.builtin.NoopResolverHook
    # 按上游返回 IP 命中的 ipset tag 改写结果；必须放在测速前。
    - class: plugins.tagset.RewriteByIPTagResolverHook
      kwargs:
        replacements:
          telegram:
            A: 203.0.113.10
            AAAA: "2001:db8::10"
          private:
            A: 127.0.0.1
            AAAA: "::1"
    - class: plugins.speedcheck.SpeedCheckResolverHook
      kwargs:
        timeout_s: 0.8
  response:
    - plugins.builtin.NoopResponseHook
    - class: plugins.speedcheck.RewriteAnswerByRTTHook
      kwargs:
        max_return_ips: 2
        ttl_s: 900
    - class: plugins.cache.CacheHook
      kwargs:
        cache_name: default-main
        max_size: 100000
